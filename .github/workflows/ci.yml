# Two jobs, and they answer different questions.
#
# `verify` asks whether the code parses and the pins still resolve — cheap, and
# it runs everywhere. `tests` asks whether ARC still behaves, on Windows,
# because that is the only platform it is actually used on: the launchers are
# PowerShell, the computer-control layer is pywin32/pycaw, and a suite passing
# on Ubuntu would be proving something about a machine nobody runs this on.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Compiles every module without running it. No API keys, no network, no
      # side effects — it only proves the code parses.
      - name: Syntax check
        run: python -m compileall -q .

      # Catches a dependency that has been pinned out of existence before the
      # other laptop discovers it mid-install.
      - name: Dependencies resolve
        run: pip install -r requirements.txt

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      # No keys, no network, no Google account, no microphone: the suites
      # sandbox themselves into a temp directory and stub what they must.
      # ARC_DATA_DIR is deliberately not set — the harness refuses to run if it
      # points anywhere that looks like real data.
      - name: Tests
        run: python tests/run_all.py

# There is no test suite here, so this checks the two things that can actually
# break a pull on another machine: a syntax error in any module, and a
# requirements.txt that no longer resolves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Compiles every module without running it. No API keys, no network, no
      # side effects — it only proves the code parses.
      - name: Syntax check
        run: python -m compileall -q .

      # Catches a dependency that has been pinned out of existence before the
      # other laptop discovers it mid-install.
      - name: Dependencies resolve
        run: pip install -r requirements.txt
